name: Deploy Frontend

# AWS-native deploy: runs on a self-hosted GitHub Actions runner installed on the
# production EC2 box (ap-south... currently eu-north-1 16.170.31.58). The runner
# pulls jobs outbound — no inbound SSH, no ECR, no AWS access keys in CI.
# Build args + runtime secrets live in /opt/zengtrade/.env on the box.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker-compose.prod.yml"
      - "nginx/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# Never let two deploys build on the box at once
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zeng-prod]
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to deploy directory
        run: |
          rsync -a --delete \
            --exclude node_modules --exclude .next \
            frontend/ /opt/zengtrade/frontend/
          cp docker-compose.prod.yml /opt/zengtrade/
          mkdir -p /opt/zengtrade/nginx
          cp nginx/default.conf /opt/zengtrade/nginx/

      - name: Build & restart app container
        working-directory: /opt/zengtrade
        run: |
          docker compose -f docker-compose.prod.yml build app
          docker compose -f docker-compose.prod.yml up -d app
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if docker inspect --format '{{.State.Health.Status}}' zengtrade-app | grep -q healthy; then
              echo "✅ zengtrade-app healthy"; exit 0
            fi
            sleep 3
          done
          echo "❌ app did not become healthy"; docker logs --tail 50 zengtrade-app; exit 1
