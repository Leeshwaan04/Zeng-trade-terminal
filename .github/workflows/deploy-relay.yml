name: Deploy Relay

# AWS-native deploy via self-hosted runner on the production EC2 box.
# No ECR, no AWS access keys, no inbound SSH. See deploy-frontend.yml.

on:
  push:
    branches: [main]
    paths:
      - "server/relay/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, zeng-prod]
    steps:
      - uses: actions/checkout@v4

      - name: Sync relay to deploy directory
        run: |
          rsync -a --delete \
            --exclude node_modules --exclude dist \
            server/relay/ /opt/zengtrade/server/relay/
          cp docker-compose.prod.yml /opt/zengtrade/

      - name: Build & restart relay container
        working-directory: /opt/zengtrade
        run: |
          docker compose -f docker-compose.prod.yml build relay
          docker compose -f docker-compose.prod.yml up -d relay
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if docker inspect --format '{{.State.Health.Status}}' zengtrade-relay | grep -q healthy; then
              echo "✅ zengtrade-relay healthy"; exit 0
            fi
            sleep 3
          done
          echo "❌ relay did not become healthy"; docker logs --tail 50 zengtrade-relay; exit 1
